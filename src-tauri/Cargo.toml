[package]
name = "quickshot"
version = "0.9.1"
description = "Fast, lightweight screenshot capture, markup and guide builder"
authors = ["ecbrown75"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "quickshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent windows on macOS (pins, countdown, thumbnail)
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-drag = "2.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
chrono = "0.4"
percent-encoding = "2"
regex = "1"
base64 = "0.22"
# barcode/QR decoding only (no image I/O, encoders or client parsers)
rxing = { version = "0.9", default-features = false, features = [
  "decoders",
  "multi_barcode_readers",
  "encoding_rs",
  "qrcode",
  "datamatrix",
  "oned",
  "pdf417",
  "aztec",
] }

[target.'cfg(windows)'.dependencies]
xcap = { version = "0.9", features = ["wgc"] }
# multi-format clipboard writes (image + HTML + text in one go) for "copy for ticket"
clipboard-win = "5"
windows = { version = "0.62", features = [
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Security_Cryptography",
  "Globalization",
  "Foundation",
  "Foundation_Collections",
  "Win32_System_Console",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_Com",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(not(windows))'.dependencies]
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGWindow", "CGDataProvider", "CGColorSpace"] }
objc2-vision = { version = "0.3", features = [
  "VNRequest",
  "VNRecognizeTextRequest",
  "VNObservation",
  "VNRequestHandler",
  "VNTypes",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
