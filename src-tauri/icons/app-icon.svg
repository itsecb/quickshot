<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- QuickShot app icon: viewfinder corners framing a lens whose tail forms a "Q".
       Source for every platform icon: `npx tauri icon src-tauri/icons/app-icon.svg`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#bg)"/>
  <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#shine)"/>
  <g fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <!-- viewfinder corners -->
    <path d="M232 372 V282 a50 50 0 0 1 50 -50 H372"/>
    <path d="M652 232 H742 a50 50 0 0 1 50 50 V372"/>
    <path d="M232 652 V742 a50 50 0 0 0 50 50 H372"/>
    <path d="M792 652 V742 a50 50 0 0 1 -50 50 H652"/>
    <!-- lens + tail = Q -->
    <circle cx="500" cy="500" r="128"/>
    <path d="M540 540 L676 676"/>
  </g>
  <circle cx="702" cy="322" r="30" fill="#35d0ff"/>
</svg>
